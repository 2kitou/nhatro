<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Quản Lý Nhà Trọ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; color: #111827; }
        .mobile-container { max-width: 480px; margin: 0 auto; background-color: #ffffff; height: 100vh; height: 100dvh; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.05); overflow: hidden; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; scroll-behavior: smooth; }
        .fade-in { animation: fadeIn 0.15s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input, button, select { font-size: 16px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;
        
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyijDGpAV6NTCCKXpDKqAvd7TIbQF2SIdx0z_J40G4NWNTnvhmfQJwvYOlDxEmNWc-IXA/exec'; 

        const loadStorageData = (m, y) => {
            const key = `nhatro_data_${y}_${m}`;
            const saved = localStorage.getItem(key);
            if (saved) { try { return JSON.parse(saved); } catch(e) {} }
            return null;
        };

        const saveStorageData = (m, y, data) => {
            const key = `nhatro_data_${y}_${m}`;
            localStorage.setItem(key, JSON.stringify(data));
        };

        const INITIAL_DATA = { buildings: [], rooms: [] };

        const Icon = ({ name, className }) => {
            const spanRef = useRef(null);
            useEffect(() => {
                if (spanRef.current && window.lucide) {
                    spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className || ''}"></i>`;
                    window.lucide.createIcons({ root: spanRef.current });
                }
            }, [name, className]);
            return <span ref={spanRef} style={{ display: 'contents' }}></span>;
        };

        const calculateBaseTotal = (room, rates) => {
            if (!rates) return 0;
            const usedElec = Math.max(0, (room.currentElec !== null ? room.currentElec : room.lastElec) - room.lastElec);
            const usedWater = Math.max(0, (room.currentWater !== null ? room.currentWater : room.lastWater) - room.lastWater);
            const carriedDebt = Number(room.debt || 0); 
            return Number(room.price) + (usedElec * rates.elec) + (usedWater * rates.water) + Number(rates.service) + carriedDebt;
        };

        const ReceiptTemplate = ({ room, month, year, rates }) => {
            if(!room || !rates) return null;
            const newElec = room.currentElec !== null ? room.currentElec : room.lastElec; 
            const newWater = room.currentWater !== null ? room.currentWater : room.lastWater;
            const uE = Math.max(0, newElec - room.lastElec); const uW = Math.max(0, newWater - room.lastWater);
            const tD = uE * rates.elec; const tN = uW * rates.water;
            const carriedDebt = Number(room.debt || 0);
            const total = calculateBaseTotal(room, rates);

            return (
                <div className="w-[420px] bg-white p-7 relative overflow-hidden" style={{ fontFamily: "'Inter', sans-serif" }}>
                    <div className="absolute inset-0 flex items-center justify-center z-0 pointer-events-none select-none overflow-hidden">
                        <span className="text-[220px] font-black text-gray-900 opacity-[0.03] rotate-[-10deg] tracking-tighter whitespace-nowrap">P.{room.name}</span>
                    </div>

                    <div className="absolute top-0 right-0 bg-blue-600 text-white px-5 py-3 rounded-bl-[2rem] shadow-md border-b-[3px] border-l-[3px] border-blue-800 z-10 flex flex-col items-center justify-center">
                        <span className="text-[10px] uppercase font-bold tracking-widest opacity-80 mb-[-2px]">PHÒNG</span>
                        <span className="text-4xl font-black leading-none">{room.name}</span>
                    </div>
                    
                    <div className="text-left mb-8 border-b-2 border-dashed border-gray-200 pb-5 pt-2 relative z-10">
                        <h1 className="text-[28px] font-black text-gray-900 tracking-tight">HÓA ĐƠN <span className="text-blue-600">P.{room.name}</span></h1>
                        <p className="text-gray-500 text-base mt-1 font-medium">Tháng {month}/{year}</p>
                    </div>
                    
                    <div className="space-y-4 mb-8 text-base relative z-10">
                        <div className="flex justify-between items-center"><span className="text-gray-600 font-medium">1. Tiền phòng</span><span className="font-bold text-gray-900 text-[17px]">{Number(room.price).toLocaleString('vi-VN')}đ</span></div>
                        
                        <div className="border-t border-gray-100 pt-3">
                            <div className="flex justify-between items-center mb-1"><span className="text-gray-600 font-medium">2. Tiền điện</span><span className="font-bold text-gray-900 text-[17px]">{tD.toLocaleString('vi-VN')}đ</span></div>
                            <div className="flex justify-between items-center text-[13px] text-gray-500">
                                <span>S.cũ: <strong className="text-gray-700">{room.lastElec}</strong> ➔ S.mới: <strong className="text-gray-700">{newElec}</strong></span>
                                <span>({uE} ký x {rates.elec.toLocaleString('vi-VN')}đ)</span>
                            </div>
                        </div>

                        <div className="border-t border-gray-100 pt-3">
                            <div className="flex justify-between items-center mb-1"><span className="text-gray-600 font-medium">3. Tiền nước</span><span className="font-bold text-gray-900 text-[17px]">{tN.toLocaleString('vi-VN')}đ</span></div>
                            <div className="flex justify-between items-center text-[13px] text-gray-500">
                                <span>S.cũ: <strong className="text-gray-700">{room.lastWater}</strong> ➔ S.mới: <strong className="text-gray-700">{newWater}</strong></span>
                                <span>({uW} khối x {rates.water.toLocaleString('vi-VN')}đ)</span>
                            </div>
                        </div>

                        <div className="border-t border-gray-100 pt-3 flex justify-between items-center"><span className="text-gray-600 font-medium">4. Phí Dịch vụ</span><span className="font-bold text-gray-900 text-[17px]">{rates.service.toLocaleString('vi-VN')}đ</span></div>
                        {carriedDebt !== 0 && (
                            <div className="border-t border-gray-100 pt-3 flex justify-between items-center text-gray-800">
                                <span className="font-bold">{carriedDebt > 0 ? '5. Nợ cũ kỳ trước' : '5. Dư cũ kỳ trước'}</span>
                                <span className={`font-black text-[17px] ${carriedDebt > 0 ? 'text-red-600' : 'text-green-600'}`}>{carriedDebt > 0 ? Number(carriedDebt).toLocaleString('vi-VN') + 'đ' : '- ' + Math.abs(carriedDebt).toLocaleString('vi-VN') + 'đ'}</span>
                            </div>
                        )}
                    </div>
                    
                    <div className="mt-2 bg-gray-900 text-white p-5 rounded-2xl flex justify-between items-center shadow-lg border border-gray-800 relative overflow-hidden z-10">
                        <div className="absolute top-0 right-0 w-32 h-32 bg-white opacity-5 rounded-full -mr-10 -mt-10"></div>
                        <span className="text-sm font-bold text-gray-300 uppercase tracking-widest z-10">Tổng cần thu</span>
                        <span className="text-2xl font-black text-white z-10">{total.toLocaleString('vi-VN')} đ</span>
                    </div>
                </div>
            );
        };

        const TabGhiSo = ({ data, setData, selectedBuilding, setSelectedBuilding, currentMonth, currentYear, syncToSheets }) => {
            const [currentIndex, setCurrentIndex] = useState(0);
            const tapeRef = useRef(null);
            const elecRef = useRef(null);
            const waterRef = useRef(null);
            const filteredRooms = data.rooms ? data.rooms.filter(r => r.buildingId === selectedBuilding) : [];
            const currentRoom = filteredRooms[currentIndex];

            useEffect(() => {
                if (tapeRef.current) {
                    const activeBtn = tapeRef.current.querySelector('.active-room');
                    if (activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            }, [currentIndex, selectedBuilding]);

            useEffect(() => setCurrentIndex(0), [selectedBuilding]);

            const handleInputChange = (roomId, field, value) => {
                const newData = { ...data, rooms: data.rooms.map(r => r.id === roomId ? { ...r, [field]: value === '' ? null : Number(value) } : r) };
                setData(newData); saveStorageData(currentMonth, currentYear, newData); syncToSheets(newData);
            };

            const handleNext = () => {
                if (currentIndex < filteredRooms.length - 1) {
                    setCurrentIndex(currentIndex + 1);
                    setTimeout(() => { if(elecRef.current) elecRef.current.focus(); }, 150);
                }
            };

            if (!data.buildings || data.buildings.length === 0) return <div className="p-8 text-center text-gray-400 mt-10">Hệ thống đang trống. Vui lòng thêm Khu Vực ở phần Cài Đặt.</div>;
            if (!selectedBuilding) return <div className="p-8 text-center text-gray-400 mt-10">Chưa chọn khu vực.</div>;
            if (filteredRooms.length === 0) return <div className="p-8 text-center text-gray-400 mt-10">Khu vực này chưa có phòng.</div>;
            const isFilled = currentRoom && currentRoom.currentElec !== null && currentRoom.currentWater !== null;

            return (
                <div className="flex flex-col h-full bg-white fade-in">
                    <div className="bg-white px-4 py-3 border-b border-gray-100 flex-shrink-0">
                        <select className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3.5 text-lg font-semibold text-gray-800 outline-none" value={selectedBuilding} onChange={e => setSelectedBuilding(e.target.value)}>
                            {data.buildings.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                        </select>
                    </div>
                    <div ref={tapeRef} className="flex overflow-x-auto px-4 py-3 gap-2 bg-white border-b border-gray-100 hide-scrollbar flex-shrink-0">
                        {filteredRooms.map((room, index) => {
                            const isRoomFilled = room.currentElec !== null && room.currentWater !== null;
                            const isActive = currentIndex === index;
                            let btnClass = "flex-shrink-0 w-16 h-16 rounded-xl flex flex-col items-center justify-center font-bold text-lg transition-all border ";
                            if (isActive) btnClass += "active-room border-gray-900 bg-gray-900 text-white shadow-sm";
                            else if (isRoomFilled) btnClass += "border-gray-200 bg-gray-50 text-gray-700";
                            else btnClass += "border-gray-200 bg-white text-gray-400";
                            return <button key={room.id} onClick={() => setCurrentIndex(index)} className={btnClass}>{room.name}</button>;
                        })}
                    </div>
                    {currentRoom && (
                        <div className="flex-1 px-4 py-6 overflow-y-auto">
                            <div className="text-center mb-6">
                                <h2 className="text-3xl font-bold text-gray-900">Phòng {currentRoom.name}</h2>
                            </div>
                            <div className="space-y-4">
                                <div className="bg-white rounded-2xl p-5 border border-gray-200 shadow-sm">
                                    <div className="flex justify-between items-center mb-3"><label className="font-semibold text-gray-700 text-sm uppercase">Số Điện</label><span className="text-sm text-gray-400">Cũ: <strong className="text-gray-700">{currentRoom.lastElec}</strong></span></div>
                                    <input ref={elecRef} type="number" inputMode="numeric" placeholder="Nhập số mới..." className="w-full bg-gray-50 rounded-xl p-4 text-3xl font-bold text-center text-gray-900 border border-gray-200 outline-none focus:border-gray-400" value={currentRoom.currentElec !== null ? currentRoom.currentElec : ''} onChange={e => handleInputChange(currentRoom.id, 'currentElec', e.target.value)} onKeyDown={e => {if(e.key==='Enter'){e.preventDefault(); waterRef.current?.focus();}}} />
                                </div>
                                <div className="bg-white rounded-2xl p-5 border border-gray-200 shadow-sm">
                                    <div className="flex justify-between items-center mb-3"><label className="font-semibold text-gray-700 text-sm uppercase">Số Nước</label><span className="text-sm text-gray-400">Cũ: <strong className="text-gray-700">{currentRoom.lastWater}</strong></span></div>
                                    <input ref={waterRef} type="number" inputMode="numeric" placeholder="Nhập số mới..." className="w-full bg-gray-50 rounded-xl p-4 text-3xl font-bold text-center text-gray-900 border border-gray-200 outline-none focus:border-gray-400" value={currentRoom.currentWater !== null ? currentRoom.currentWater : ''} onChange={e => handleInputChange(currentRoom.id, 'currentWater', e.target.value)} onKeyDown={e => {if(e.key==='Enter'){e.preventDefault(); handleNext();}}} />
                                </div>
                            </div>
                            <button onClick={handleNext} className={`mt-6 w-full py-4 rounded-xl font-bold text-lg flex justify-center items-center gap-2 transition-all ${isFilled ? 'bg-gray-900 text-white shadow-sm' : 'bg-gray-100 text-gray-400'}`}>
                                {currentIndex < filteredRooms.length - 1 ? 'Lưu & Phòng Tiếp' : 'Hoàn Tất'} <Icon name="arrow-right" className="w-5 h-5" />
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const TabThuTien = ({ data, setData, selectedBuilding, setSelectedBuilding, currentMonth, currentYear, syncToSheets }) => {
            const [toastMsg, setToastMsg] = useState('');
            const [receiptRoom, setReceiptRoom] = useState(null);
            const [receiptImgUrl, setReceiptImgUrl] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [batchState, setBatchState] = useState({ isOpen: false, isGenerating: false, progress: 0, files: null });
            
            const receiptRef = useRef(null);

            if (!data.buildings || data.buildings.length === 0) return <div className="p-8 text-center text-gray-400 mt-10">Hệ thống đang trống.</div>;

            const currentBuilding = data.buildings.find(b => b.id === selectedBuilding);
            const currentRates = currentBuilding?.rates || { elec: 0, water: 0, service: 0 };
            const filteredRooms = data.rooms.filter(r => r.buildingId === selectedBuilding);
            
            const totalRevenue = filteredRooms.reduce((sum, r) => sum + calculateBaseTotal(r, currentRates), 0);
            const collectedRevenue = filteredRooms.reduce((sum, r) => {
                const total = calculateBaseTotal(r, currentRates);
                const status = r.paymentStatus || 'none';
                const sub = Number(r.subDebt || 0);
                if (status === 'paid') return sum + total;
                if (status === 'debt') return sum + Math.max(0, total - sub);
                if (status === 'excess') return sum + total + sub;
                return sum;
            }, 0);

            const handleCreateReceipt = (room) => {
                setReceiptRoom(room); setReceiptImgUrl(''); setIsGenerating(true);
                setTimeout(() => generateImage(), 400);
            };

            const generateImage = async () => {
                if (!receiptRef.current) return;
                try {
                    const canvas = await html2canvas(receiptRef.current, { scale: 2, backgroundColor: '#ffffff' });
                    setReceiptImgUrl(canvas.toDataURL('image/png'));
                    setIsGenerating(false);
                } catch (err) { setIsGenerating(false); }
            };

            const handleDownloadSingle = () => {
                const link = document.createElement('a'); link.href = receiptImgUrl; link.download = `HoaDon_P${receiptRoom.name}_Thang${currentMonth}.png`; link.click();
                setToastMsg('Đã tải ảnh về máy!'); setTimeout(() => setToastMsg(''), 2500);
            };

            const handleShareNative = async () => {
                try {
                    const response = await fetch(receiptImgUrl); const blob = await response.blob();
                    const file = new File([blob], `HoaDon_P${receiptRoom.name}.png`, { type: 'image/png' });
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({ files: [file], title: `Hóa Đơn P.${receiptRoom.name}` });
                    } else { setToastMsg('Trình duyệt không hỗ trợ!'); setTimeout(() => setToastMsg(''), 2500); }
                } catch (err) {}
            };

            const handleBatchShareClick = async () => {
                const readyRooms = filteredRooms.filter(r => r.currentElec !== null && r.currentWater !== null);
                if(readyRooms.length === 0) { setToastMsg("Chưa có phòng nào chốt số!"); setTimeout(() => setToastMsg(''), 2500); return; }

                setBatchState({ isOpen: true, isGenerating: true, progress: 0, files: null });
                try {
                    let filesArray = [];
                    for (let i = 0; i < readyRooms.length; i++) {
                        let r = readyRooms[i]; const el = document.getElementById(`receipt-batch-${r.id}`);
                        if (el) {
                            const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#ffffff' });
                            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                            const file = new File([blob], `HoaDon_P${r.name}_Thang${currentMonth}.png`, { type: 'image/png' });
                            filesArray.push(file);
                        }
                        setBatchState(prev => ({ ...prev, progress: i + 1 })); await new Promise(res => setTimeout(res, 50)); 
                    }
                    setBatchState(prev => ({ ...prev, isGenerating: false, files: filesArray }));
                } catch(e) { 
                    setBatchState({ isOpen: false, isGenerating: false, progress: 0, files: null });
                    setToastMsg("Lỗi hệ thống!"); setTimeout(() => setToastMsg(''), 3000);
                }
            };

            const handleConfirmBatchShare = async () => {
                if (!batchState.files) return;
                try {
                    if (navigator.canShare && navigator.canShare({ files: batchState.files })) {
                        await navigator.share({ files: batchState.files, title: `Hóa Đơn Tháng ${currentMonth}` });
                    } else {
                        const JSZip = window.JSZip; const zip = new JSZip();
                        batchState.files.forEach(f => zip.file(f.name, f));
                        const content = await zip.generateAsync({type: "blob"});
                        const link = document.createElement('a'); link.href = URL.createObjectURL(content); link.download = `TatCa_HoaDon_Thang_${currentMonth}_${currentYear}.zip`; link.click();
                        setToastMsg('Đã nén toàn bộ thành File ZIP!'); setTimeout(() => setToastMsg(''), 3000);
                    }
                } catch(e) {}
                setBatchState({ isOpen: false, isGenerating: false, progress: 0, files: null });
            };

            const handleStatusChange = (roomId, status) => {
                const targetRoom = data.rooms.find(r => r.id === roomId);
                const newStatus = targetRoom.paymentStatus === status ? 'none' : status;
                const newData = { ...data, rooms: data.rooms.map(r => { if (r.id === roomId) return { ...r, paymentStatus: newStatus, subDebt: newStatus === 'none' ? 0 : (newStatus === 'paid' ? 0 : r.subDebt) }; return r; }) };
                setData(newData); saveStorageData(currentMonth, currentYear, newData); syncToSheets(newData);
            };

            const handleSubAmountInput = (roomId, val) => {
                const num = val === '' ? 0 : Number(val);
                const newData = { ...data, rooms: data.rooms.map(r => r.id === roomId ? { ...r, subDebt: num } : r) };
                setData(newData); saveStorageData(currentMonth, currentYear, newData); syncToSheets(newData);
            };

            if (!selectedBuilding) return <div className="p-8 text-center text-gray-400 mt-10">Chưa có khu vực.</div>;

            return (
                <div className="flex flex-col h-full bg-white fade-in">
                    {toastMsg && <div className="fixed top-16 left-1/2 transform -translate-x-1/2 w-11/12 max-w-sm bg-gray-900 text-white px-5 py-3 rounded-xl shadow-lg z-[100] text-sm font-medium text-center fade-in">{toastMsg}</div>}

                    <div className="bg-white p-4 border-b border-gray-100 flex-shrink-0">
                        <select className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3.5 text-lg font-semibold text-gray-800 outline-none" value={selectedBuilding} onChange={e => setSelectedBuilding(e.target.value)}>
                            {data.buildings.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                        </select>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 pb-20">
                        <div className="bg-gray-50 p-4 rounded-2xl border border-gray-200 mb-4 text-center">
                            <span className="text-xs font-semibold text-gray-400 tracking-wider uppercase">ĐÃ THU / TỔNG THU</span>
                            <div className="text-2xl font-bold text-gray-900 mt-1"><span className="text-gray-900">{collectedRevenue.toLocaleString('vi-VN')}đ</span> <span className="text-gray-300 font-light mx-2">/</span> <span className="text-gray-400 font-medium">{totalRevenue.toLocaleString('vi-VN')}đ</span></div>
                        </div>

                        <div className="mb-4">
                            <button onClick={handleBatchShareClick} className="w-full py-4 bg-blue-600 text-white font-bold rounded-2xl text-sm flex items-center justify-center gap-2 shadow-sm transition-all hover:bg-blue-700">
                                <Icon name="images" className="w-5 h-5" /> Lưu Toàn Bộ Vào Thư Viện Ảnh (Hoặc ZIP)
                            </button>
                        </div>
                        
                        <div className="space-y-3">
                            {filteredRooms.map(room => {
                                const total = calculateBaseTotal(room, currentRates);
                                const isReady = room.currentElec !== null && room.currentWater !== null;
                                const status = room.paymentStatus || 'none';

                                return (
                                    <div key={room.id} className="bg-white border border-gray-200 rounded-2xl p-4 shadow-sm">
                                        <div className="flex justify-between items-start mb-3">
                                            <h4 className="font-bold text-2xl text-gray-900">P.{room.name}</h4>
                                            <div className="text-right">
                                                <span className="text-xs text-gray-400 uppercase font-medium">Tổng tiền</span>
                                                <p className="font-bold text-lg text-gray-900">{total.toLocaleString('vi-VN')}đ</p>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-3 gap-2 mb-3">
                                            <button onClick={() => handleStatusChange(room.id, 'paid')} className={`py-2.5 rounded-xl font-semibold text-xs border transition-all ${status === 'paid' ? 'bg-gray-900 text-white border-gray-900' : 'bg-white text-gray-700 border-gray-200'}`}>ĐỦ TIỀN</button>
                                            <button onClick={() => handleStatusChange(room.id, 'debt')} className={`py-2.5 rounded-xl font-semibold text-xs border transition-all ${status === 'debt' ? 'bg-gray-900 text-white border-gray-900' : 'bg-white text-gray-700 border-gray-200'}`}>CÒN NỢ</button>
                                            <button onClick={() => handleStatusChange(room.id, 'excess')} className={`py-2.5 rounded-xl font-semibold text-xs border transition-all ${status === 'excess' ? 'bg-gray-900 text-white border-gray-900' : 'bg-white text-gray-700 border-gray-200'}`}>ĐÓNG DƯ</button>
                                        </div>

                                        {status === 'debt' && (
                                            <div className="bg-gray-50 p-3 rounded-xl border border-gray-200 mb-3 flex items-center justify-between fade-in"><span className="text-xs font-semibold text-gray-600">Trả thiếu (nợ sang tháng sau):</span><div className="relative w-1/2"><input type="number" placeholder="Số tiền..." className="w-full bg-white border border-gray-200 p-2 rounded-lg font-bold text-right text-gray-900 outline-none pr-5 text-sm" value={room.subDebt !== undefined && room.subDebt !== 0 ? room.subDebt : ''} onChange={e => handleSubAmountInput(room.id, e.target.value)} /><span className="absolute right-2 top-2 text-gray-400 text-xs">đ</span></div></div>

                                            <div className="bg-gray-50 p-3 rounded-xl border border-gray-200 mb-3 flex items-center justify-between fade-in"><span className="text-xs font-semibold text-gray-600">Đóng dư (trừ tiền tháng sau):</span><div className="relative w-1/2"><input type="number" placeholder="Số tiền..." className="w-full bg-white border border-gray-200 p-2 rounded-lg font-bold text-right text-gray-900 outline-none pr-5 text-sm" value={room.subDebt !== undefined && room.subDebt !== 0 ? room.subDebt : ''} onChange={e => handleSubAmountInput(room.id, e.target.value)} /><span className="absolute right-2 top-2 text-gray-400 text-xs">đ</span></div></div>
                                        )}
                                        
                                        <button onClick={() => handleCreateReceipt(room)} disabled={!isReady} className={`w-full py-3 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 ${isReady ? 'bg-gray-100 text-gray-800 border border-gray-200 hover:bg-gray-200' : 'bg-gray-50 text-gray-300 border border-gray-100'}`}>
                                            <Icon name="image" className="w-4 h-4" /> Xem Hóa Đơn Lẻ
                                        </button>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {batchState.isOpen && (
                        <div className="fixed inset-0 bg-black/80 z-[9999] flex flex-col items-center justify-center p-4 fade-in backdrop-blur-sm">
                            <div className="bg-white w-full max-w-[380px] rounded-3xl overflow-hidden shadow-2xl flex flex-col p-6 items-center text-center">
                                {batchState.isGenerating ? (
                                    <>

                                        <h3 className="font-bold text-lg text-gray-900 mb-2">Đang tạo ảnh hàng loạt...</h3>
                                        <p className="text-gray-500 font-medium text-sm mb-1">Vui lòng không đóng ứng dụng</p>
                                        <div className="w-full bg-gray-200 rounded-full h-2.5 mt-4"><div className="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style={{ width: `${(batchState.progress / filteredRooms.filter(r => r.currentElec !== null && r.currentWater !== null).length) * 100}%` }}></div></div>
                                        <p className="text-sm text-blue-600 mt-2 font-bold">{batchState.progress} / {filteredRooms.filter(r => r.currentElec !== null && r.currentWater !== null).length} phòng</p>
                                    </>

                                        <div className="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mb-4"><Icon name="check" className="w-8 h-8 text-green-600" /></div>

                                        <p className="text-gray-500 text-sm mb-6">Bấm nút bên dưới để lưu toàn bộ ảnh vào điện thoại (Hoặc tải file ZIP).</p>
                                        <button onClick={handleConfirmBatchShare} className="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-2xl shadow-md flex items-center justify-center gap-2 mb-3 transition-all"><Icon name="share" className="w-5 h-5" /> CHIA SẺ & LƯU ẢNH</button>
                                        <button onClick={() => setBatchState({ isOpen: false, isGenerating: false, progress: 0, files: null })} className="w-full py-3 bg-gray-100 text-gray-600 font-bold rounded-xl hover:bg-gray-200 transition-all">Hủy bỏ</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {receiptRoom && (
                        <div className="fixed inset-0 bg-black/80 z-[9999] flex flex-col items-center justify-center p-4 fade-in backdrop-blur-sm">
                            <div className="bg-white w-full max-w-[420px] max-h-[95vh] rounded-3xl overflow-hidden shadow-2xl flex flex-col">
                                <div className="flex justify-between items-center p-4 border-b border-gray-100 bg-white flex-shrink-0"><h3 className="font-bold text-base text-gray-900">Chi tiết Hóa đơn</h3><button onClick={() => setReceiptRoom(null)} className="p-2 bg-gray-100 text-gray-600 rounded-full hover:bg-gray-200"><Icon name="x" className="w-4 h-4" /></button></div>
                                <div className="p-4 flex-1 min-h-0 bg-gray-100 overflow-y-auto flex flex-col items-center justify-start relative">
                                    {isGenerating ? (
                                        <div className="flex flex-col items-center justify-center h-full text-gray-500 py-10"><Icon name="loader" className="w-8 h-8 animate-spin mb-3 text-blue-500" /><p className="text-sm font-medium">Đang tạo ảnh...</p></div>
                                    ) : ( 
                                        receiptImgUrl && (
                                            <div className="w-full flex flex-col items-center">
                                                <div className="bg-blue-100 border border-blue-200 text-blue-800 text-xs font-semibold px-4 py-2.5 rounded-xl mb-4 w-full text-center flex items-center justify-center gap-2 shadow-sm"><Icon name="smartphone" className="w-4 h-4" /> Mẹo ĐT: Chạm giữ ảnh để "Lưu vào Ảnh"</div>
                                                <img src={receiptImgUrl} className="w-full h-auto shadow-md rounded-2xl block border border-gray-200" alt="Hóa đơn" />
                                            </div>
                                        ) 
                                    )}
                                </div>
                                <div className="p-4 bg-white flex flex-col gap-2.5 flex-shrink-0 border-t border-gray-100">
                                    <div className="flex gap-2">
                                        <button onClick={handleDownloadSingle} disabled={isGenerating} className="flex-1 py-3.5 bg-gray-900 hover:bg-black text-white font-bold text-xs rounded-xl shadow-sm flex justify-center items-center gap-2 transition-all"><Icon name="download" className="w-4 h-4" /> Tải về máy</button>
                                        <button onClick={handleShareNative} disabled={isGenerating} className="flex-1 py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-sm flex justify-center items-center gap-2 transition-all"><Icon name="share" className="w-4 h-4" /> Chia sẻ hệ thống</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="fixed top-[-9999px] left-[-9999px]">
                        <div ref={receiptRef}>
                            <ReceiptTemplate room={receiptRoom} month={currentMonth} year={currentYear} rates={currentRates} />
                        </div>
                        {filteredRooms.filter(r => r.currentElec !== null && r.currentWater !== null).map(r => (
                            <div key={`batch-${r.id}`} id={`receipt-batch-${r.id}`}>
                                <ReceiptTemplate room={r} month={currentMonth} year={currentYear} rates={currentRates} />
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const TabCaiDat = ({ data, setData, selectedBuilding, setSelectedBuilding, currentMonth, currentYear, syncToSheets }) => {
            const [bulkPrice, setBulkPrice] = useState('');
            const [selectedRooms, setSelectedRooms] = useState([]);
            const [addCount, setAddCount] = useState(1);
            const [addStart, setAddStart] = useState(1);

            const currentBuilding = data.buildings && data.buildings.length > 0 ? data.buildings.find(b => b.id === selectedBuilding) : null;
            const filteredRooms = data.rooms ? data.rooms.filter(r => r.buildingId === selectedBuilding) : [];

            const toggleRoom = (id) => {
                setSelectedRooms(prev => prev.includes(id) ? prev.filter(rId => rId !== id) : [...prev, id]);
            };
            const toggleAll = () => {
                if (selectedRooms.length === filteredRooms.length && filteredRooms.length > 0) setSelectedRooms([]);
                else setSelectedRooms(filteredRooms.map(r => r.id));
            };

            const handleRate = (field, val) => {
                if(!currentBuilding) return;
                const newData = { ...data, buildings: data.buildings.map(b => b.id === selectedBuilding ? { ...b, rates: { ...b.rates, [field]: Number(val) } } : b) };
                setData(newData); saveStorageData(currentMonth, currentYear, newData); syncToSheets(newData);
            };

            const handleBuildingUpdate = (id, newName) => {
                const newData = { ...data, buildings: data.buildings.map(b => b.id === id ? { ...b, name: newName } : b) };
                setData(newData); saveStorageData(currentMonth, currentYear, newData); syncToSheets(newData);
            };
            const addBuilding = () => {
                const newId = 'khu_' + Date.now(); 
                const newBuildings = data.buildings ? [...data.buildings, { id: newId, name: 'Khu Trọ Mới', rates: { elec: 3500, water: 14000, service: 50000 } }] : [{ id: newId, name: 'Khu Trọ Mới', rates: { elec: 3500, water: 14000, service: 50000 } }];
                const newData = { ...data, buildings: newBuildings };
                setData(newData); setSelectedBuilding(newId); saveStorageData(currentMonth, currentYear, newData); syncToSheets(newData);
            };
            const deleteBuilding = () => {
                if(!selectedBuilding) return;
                if(window.confirm(`Xóa toàn bộ ${currentBuilding.name} và các phòng bên trong?`)) {
                    const newData = { ...data, buildings: data.buildings.filter(b => b.id !== selectedBuilding), rooms: data.rooms ? data.rooms.filter(r => r.buildingId !== selectedBuilding) : [] };
                    setData(newData); saveStorageData(currentMonth, currentYear, newData); syncToSheets(newData); setSelectedBuilding(newData.buildings[0]?.id || '');
                }
            };

            const handleRoomUpdate = (id, field, val) => {
                const newData = { ...data, rooms: data.rooms.map(r => r.id === id ? { ...r, [field]: (field === 'price' || field === 'debt') ? (val === '' ? 0 : Number(val)) : val } : r) };
                setData(newData); saveStorageData(currentMonth, currentYear, newData); syncToSheets(newData);
            };

            const handleBulkAdd = () => {
                if(!selectedBuilding) return;
                let newRooms = [];
                let start = Number(addStart) || 1;
                let count = Number(addCount) || 1;
                for(let i=0; i<count; i++) {
                    newRooms.push({
                        id: 'r_' + Date.now() + i, 
                        buildingId: selectedBuilding, 
                        name: String(start + i), 
                        price: 1500000, debt: 0, lastElec: 0, lastWater: 0, 
                        currentElec: null, currentWater: null, paymentStatus: 'none', subDebt: 0
                    });
                }
                const newData = { ...data, rooms: [...(data.rooms||[]), ...newRooms] };
                setData(newData); saveStorageData(currentMonth, currentYear, newData); syncToSheets(newData);
                setAddCount(1); setAddStart(start + count);
            };

            const deleteRoom = (id) => {
                if(window.confirm("Xóa phòng này?")) {
                    const newData = { ...data, rooms: data.rooms.filter(r => r.id !== id) };
                    setData(newData); saveStorageData(currentMonth, currentYear, newData); syncToSheets(newData);
                    setSelectedRooms(prev => prev.filter(rId => rId !== id));
                }
            };

            const applyBulkPrice = () => {
                if(!bulkPrice || isNaN(bulkPrice) || selectedRooms.length === 0) return;
                const newData = { ...data, rooms: data.rooms.map(r => selectedRooms.includes(r.id) ? { ...r, price: Number(bulkPrice) } : r) };
                setData(newData); saveStorageData(currentMonth, currentYear, newData); syncToSheets(newData); 
                setBulkPrice(''); setSelectedRooms([]); alert("Đã cập nhật giá hàng loạt!");
            };

            return (
                <div className="flex flex-col h-full bg-white overflow-y-auto p-4 space-y-6 fade-in pb-20">
                    <div className="space-y-2">
                        <div className="flex justify-between items-end mb-1"><span className="text-xs font-semibold text-gray-400 uppercase tracking-wider">Chọn Khu Vực</span><button onClick={addBuilding} className="text-blue-600 font-semibold text-xs hover:underline">+ Thêm Khu</button></div>
                        {data.buildings && data.buildings.length > 0 ? (
                            <div className="bg-white rounded-2xl border border-gray-200 overflow-hidden shadow-sm">
                                <select className="w-full bg-gray-50 p-3.5 text-lg font-semibold text-gray-900 outline-none border-b border-gray-100" value={selectedBuilding} onChange={e => setSelectedBuilding(e.target.value)}>
                                    {data.buildings.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                                </select>
                                {currentBuilding && (
                                    <div className="flex items-center p-2.5 gap-2 bg-white">
                                        <input value={currentBuilding.name} onChange={e => handleBuildingUpdate(currentBuilding.id, e.target.value)} className="flex-1 bg-gray-50 border border-gray-200 p-2.5 rounded-xl font-medium text-sm outline-none" placeholder="Đổi tên khu..." />
                                        <button onClick={deleteBuilding} className="p-2.5 bg-gray-100 text-gray-600 rounded-xl hover:bg-gray-200"><Icon name="trash-2" className="w-4 h-4" /></button>
                                    </div>
                                )}
                            </div>
                        ) : (<div className="p-4 bg-gray-50 border border-gray-200 rounded-xl text-center text-gray-500 text-sm">Chưa có khu vực nào. Hãy bấm Thêm Khu.</div>)}
                    </div>

                    {currentBuilding && (
                        <>
                            <div className="space-y-2">
                                <span className="text-xs font-semibold text-gray-400 uppercase tracking-wider">Đơn Giá: {currentBuilding.name}</span>
                                <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 space-y-3">
                                    <div className="flex justify-between items-center"><span className="text-sm font-medium text-gray-600">Điện (1 ký)</span><div className="relative w-1/2"><input type="number" value={currentBuilding.rates.elec} onChange={e => handleRate('elec', e.target.value)} className="w-full bg-gray-50 border border-gray-200 p-2.5 rounded-xl font-bold text-base text-right outline-none pr-6" /><span className="absolute right-2.5 top-2.5 text-gray-400 text-xs font-medium">đ</span></div></div>
                                    <div className="flex justify-between items-center"><span className="text-sm font-medium text-gray-600">Nước (1 khối)</span><div className="relative w-1/2"><input type="number" value={currentBuilding.rates.water} onChange={e => handleRate('water', e.target.value)} className="w-full bg-gray-50 border border-gray-200 p-2.5 rounded-xl font-bold text-base text-right outline-none pr-6" /><span className="absolute right-2.5 top-2.5 text-gray-400 text-xs font-medium">đ</span></div></div>
                                    <div className="flex justify-between items-center"><span className="text-sm font-medium text-gray-600">Phí Dịch vụ</span><div className="relative w-1/2"><input type="number" value={currentBuilding.rates.service} onChange={e => handleRate('service', e.target.value)} className="w-full bg-gray-50 border border-gray-200 p-2.5 rounded-xl font-bold text-base text-right outline-none pr-6" /><span className="absolute right-2.5 top-2.5 text-gray-400 text-xs font-medium">đ</span></div></div>
                                </div>
                            </div>
                            
                            <div className="space-y-2">
                                <span className="text-xs font-semibold text-gray-400 uppercase tracking-wider">Cập Nhật Phòng Nhanh</span>
                                
                                {/* BỘ CÔNG CỤ TỐI ƯU MỚI: THÊM NHANH VÀ ĐỔI GIÁ HÀNG LOẠT */}
                                <div className="bg-gray-50 p-4 rounded-2xl border border-gray-200 space-y-4 mb-4">
                                    <div>
                                        <span className="text-[11px] font-bold text-gray-500 uppercase">1. Thêm N phòng cùng lúc</span>
                                        <div className="flex gap-2 mt-1.5">
                                            <input type="number" placeholder="Số lượng..." value={addCount} onChange={e=>setAddCount(e.target.value)} className="w-1/3 bg-white p-2.5 rounded-xl border border-gray-200 font-semibold text-sm outline-none" />
                                            <input type="number" placeholder="Bắt đầu từ (VD: 101)..." value={addStart} onChange={e=>setAddStart(e.target.value)} className="flex-1 bg-white p-2.5 rounded-xl border border-gray-200 font-semibold text-sm outline-none" />
                                            <button onClick={handleBulkAdd} className="bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm px-4 rounded-xl shadow-sm transition-all">+ Thêm</button>
                                        </div>
                                    </div>
                                    <div className="border-t border-gray-200 pt-3">
                                        <span className="text-[11px] font-bold text-gray-500 uppercase">2. Đổi giá cho {selectedRooms.length} phòng đã chọn</span>
                                        <div className="flex gap-2 mt-1.5">
                                            <input type="number" placeholder="Nhập giá mới..." value={bulkPrice} onChange={e => setBulkPrice(e.target.value)} className="flex-1 bg-white p-2.5 rounded-xl border border-gray-200 font-semibold text-sm outline-none" disabled={selectedRooms.length === 0} />
                                            <button onClick={applyBulkPrice} disabled={selectedRooms.length === 0} className={`font-bold text-sm px-4 rounded-xl transition-all shadow-sm ${selectedRooms.length === 0 ? 'bg-gray-200 text-gray-400' : 'bg-gray-900 text-white hover:bg-black'}`}>Áp dụng</button>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white rounded-2xl border border-gray-200 overflow-x-auto shadow-sm">
                                    <table className="w-full text-left border-collapse min-w-[280px]">
                                        <thead>
                                            <tr className="bg-gray-50 text-gray-500 text-[11px] uppercase tracking-wide border-b border-gray-200">
                                                <th className="p-3 w-12 text-center cursor-pointer" onClick={toggleAll}>
                                                    <input type="checkbox" className="w-4 h-4 accent-gray-900" readOnly checked={selectedRooms.length === filteredRooms.length && filteredRooms.length > 0} />
                                                </th>
                                                <th className="p-3 font-bold w-20">Phòng</th>
                                                <th className="p-3 font-bold flex-1">Giá Thuê (đ)</th>
                                                <th className="p-3 font-bold w-12 text-center">Xóa</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {filteredRooms.map((room, index) => (
                                                <tr key={room.id} className={`border-b border-gray-100 transition-colors ${selectedRooms.includes(room.id) ? 'bg-blue-50/30' : ''}`}>
                                                    <td className="p-2 text-center cursor-pointer" onClick={() => toggleRoom(room.id)}>
                                                        <input type="checkbox" className="w-4 h-4 accent-gray-900 pointer-events-none" readOnly checked={selectedRooms.includes(room.id)} />
                                                    </td>
                                                    <td className="p-2"><input value={room.name} onChange={e => handleRoomUpdate(room.id, 'name', e.target.value)} className="w-full bg-gray-50 border border-gray-100 p-2.5 rounded-xl font-bold text-sm text-center outline-none focus:border-gray-300 transition-all" /></td>
                                                    <td className="p-2"><input type="number" value={room.price} onChange={e => handleRoomUpdate(room.id, 'price', e.target.value)} className="w-full bg-gray-50 border border-gray-100 p-2.5 rounded-xl font-semibold outline-none text-xs focus:border-gray-300 transition-all" /></td>
                                                    <td className="p-2 text-center"><button onClick={() => deleteRoom(room.id)} className="text-gray-400 hover:text-red-500 p-2 rounded-lg hover:bg-red-50 transition-all"><Icon name="trash-2" className="w-4 h-4" /></button></td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    {filteredRooms.length === 0 && <p className="text-center text-gray-400 text-sm py-8 font-medium">Khu vực này chưa có phòng.</p>}
                                </div>
                            </div>
                        </>
                    )}
                </div>
            );
        };

        const App = () => {
            const date = new Date();
            const [currentMonth, setCurrentMonth] = useState(date.getMonth() + 1);
            const [currentYear, setCurrentYear] = useState(date.getFullYear());
            const [data, setData] = useState(() => { const saved = loadStorageData(currentMonth, currentYear); return saved ? saved : INITIAL_DATA; });
            const [activeTab, setActiveTab] = useState('ghi_so');
            const [selectedBuilding, setSelectedBuilding] = useState('');
            const [syncStatus, setSyncStatus] = useState({ text: 'Đang kết nối...', color: 'text-blue-400' });
            
            const syncTimeout = useRef(null);
            const skipFetchRef = useRef(false);

            useEffect(() => {
                if (data.buildings && data.buildings.length > 0 && !selectedBuilding) {
                    setSelectedBuilding(data.buildings[0].id);
                }
            }, [data.buildings, selectedBuilding]);

            const wipeInitialData = () => {
                const cleanData = { buildings: [], rooms: [] };
                setData(cleanData); saveStorageData(currentMonth, currentYear, cleanData); return cleanData;
            };

            const parseSheetData = (resData, currentBuildingsList = []) => {
                let newBuildings = []; let newRooms = [];
                let currentBuildingName = "";
                
                const header = resData[0];
                const colIdx = {
                    dienCu: header.indexOf("Điện Cũ") >= 0 ? header.indexOf("Điện Cũ") : 3, 
                    dienMoi: header.indexOf("Điện Mới") >= 0 ? header.indexOf("Điện Mới") : 4,
                    nuocCu: header.indexOf("Nước Cũ") >= 0 ? header.indexOf("Nước Cũ") : 5,
                    nuocMoi: header.indexOf("Nước Mới") >= 0 ? header.indexOf("Nước Mới") : 6,
                    tienPhong: header.indexOf("Tiền Phòng") >= 0 ? header.indexOf("Tiền Phòng") : 7,
                    phiKhac: header.findIndex(h => h.includes("Phí Khác")) >= 0 ? header.findIndex(h => h.includes("Phí Khác")) : 8,
                    debt: header.indexOf("Nợ/Dư Kỳ Trước") >= 0 ? header.indexOf("Nợ/Dư Kỳ Trước") : 9,
                    daThanhToan: header.indexOf("Đã Thanh Toán") >= 0 ? header.indexOf("Đã Thanh Toán") : 10,
                    tongTien: header.indexOf("Tổng Hóa Đơn") >= 0 ? header.indexOf("Tổng Hóa Đơn") : 11,
                    donGiaDien: header.indexOf("Đơn Giá Điện") >= 0 ? header.indexOf("Đơn Giá Điện") : 12,
                    donGiaNuoc: header.indexOf("Đơn Giá Nước") >= 0 ? header.indexOf("Đơn Giá Nước") : 13
                };

                for (let i = 1; i < resData.length; i++) {
                    const row = resData[i];
                    if (!row[1] && !row[2] && !currentBuildingName) continue; 

                    const buildingName = row[1] ? String(row[1]).trim() : currentBuildingName;
                    if (row[1]) currentBuildingName = buildingName;
                    
                    const roomNameRaw = String(row[2]).replace('Phòng ', '').trim();
                    const lastElec = Number(row[colIdx.dienCu] || 0); 
                    const currentElec = row[colIdx.dienMoi] === "" || row[colIdx.dienMoi] === undefined ? null : Number(row[colIdx.dienMoi]);
                    const lastWater = Number(row[colIdx.nuocCu] || 0); 
                    const currentWater = row[colIdx.nuocMoi] === "" || row[colIdx.nuocMoi] === undefined ? null : Number(row[colIdx.nuocMoi]);
                    const price = Number(row[colIdx.tienPhong] || 0); 
                    const debt = Number(row[colIdx.debt] || 0);
                    
                    const daThanhToanSheet = row[colIdx.daThanhToan];
                    const tongTienSheet = Number(row[colIdx.tongTien] || 0);

                    // MẮT THẦN ĐỌC GIÁ ĐIỆN, NƯỚC, DỊCH VỤ TỪ GOOGLE SHEETS
                    const elecRate = row[colIdx.donGiaDien] !== undefined && row[colIdx.donGiaDien] !== "" ? Number(row[colIdx.donGiaDien]) : 3500;
                    const waterRate = row[colIdx.donGiaNuoc] !== undefined && row[colIdx.donGiaNuoc] !== "" ? Number(row[colIdx.donGiaNuoc]) : 14000;
                    const serviceRate = row[colIdx.phiKhac] !== undefined && row[colIdx.phiKhac] !== "" ? Number(row[colIdx.phiKhac]) : 50000;

                    let b = newBuildings.find(b => b.name === buildingName);
                    if (!b) { 
                        const oldB = currentBuildingsList.find(ob => ob.name === buildingName);
                        b = { id: oldB ? oldB.id : 'b_' + Date.now() + i, name: buildingName, rates: { elec: elecRate, water: waterRate, service: serviceRate } }; 
                        newBuildings.push(b); 
                    }

                    const usedE = Math.max(0, (currentElec !== null ? currentElec : lastElec) - lastElec);
                    const usedW = Math.max(0, (currentWater !== null ? currentWater : lastWater) - lastWater);
                    const expectedTotal = price + (usedE * b.rates.elec) + (usedW * b.rates.water) + b.rates.service + debt;
                    
                    let computedStatus = 'none'; let computedSubDebt = 0;
                    if (daThanhToanSheet !== "" && daThanhToanSheet !== null && daThanhToanSheet !== undefined) {
                        const paidNum = Number(daThanhToanSheet);
                        if (paidNum === expectedTotal && expectedTotal > 0) { computedStatus = 'paid'; } 
                        else if (paidNum < expectedTotal) { computedStatus = 'debt'; computedSubDebt = expectedTotal - paidNum; } 
                        else if (paidNum > expectedTotal) { computedStatus = 'excess'; computedSubDebt = paidNum - expectedTotal; } 
                        else if (paidNum === 0 && expectedTotal > 0) { computedStatus = 'none'; }
                    }

                    const currentRoomsList = data && data.rooms ? data.rooms : [];
                    const oldR = currentRoomsList.find(or => or.name === roomNameRaw && or.buildingId === b.id);
                    const roomId = oldR ? oldR.id : 'r_' + Date.now() + i;
                    newRooms.push({ id: roomId, buildingId: b.id, name: roomNameRaw, price, debt, lastElec, currentElec, lastWater, currentWater, paymentStatus: computedStatus, subDebt: computedSubDebt });
                }
                return { buildings: newBuildings, rooms: newRooms };
            };

            const syncToSheets = useCallback(async (currentData, month = currentMonth, year = currentYear) => {
                if (!SCRIPT_URL) return;
                setSyncStatus({ text: 'Đang lưu...', color: 'text-yellow-400' });
                const payload = { ...currentData, month: String(month).padStart(2, '0'), year: String(year) };
                
                if (syncTimeout.current) clearTimeout(syncTimeout.current);
                syncTimeout.current = setTimeout(async () => {
                    try { 
                        await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }); 
                        setSyncStatus({ text: 'Đã lưu', color: 'text-green-400' });
                        setTimeout(() => setSyncStatus({ text: '', color: '' }), 2500);
                    } catch (e) { setSyncStatus({ text: 'Lỗi mạng', color: 'text-red-400' }); }
                }, 800); 
            }, [currentMonth, currentYear]);

            const fetchDataFromSheet = async (month, year) => {
                if (!SCRIPT_URL) return;
                setSyncStatus({ text: 'Đang tải...', color: 'text-blue-400' });
                try {
                    const res = await fetch(`${SCRIPT_URL}?month=${String(month).padStart(2, '0')}&year=${year}&t=${Date.now()}`);
                    const resData = await res.json();
                    
                    if (Array.isArray(resData)) {
                        if (resData.length <= 1) {
                            setSyncStatus({ text: 'Đang chốt sổ...', color: 'text-yellow-400' });
                            let prevM = month - 1; let prevY = year;
                            if (prevM < 1) { prevM = 12; prevY -= 1; }
                            
                            const prevRes = await fetch(`${SCRIPT_URL}?month=${String(prevM).padStart(2, '0')}&year=${prevY}&t=${Date.now()}`);
                            const prevResData = await prevRes.json();

                            if (Array.isArray(prevResData) && prevResData.length > 1) {
                                const pData = parseSheetData(prevResData, data.buildings || []);
                                const newData = { 
                                    buildings: pData.buildings, 
                                    rooms: pData.rooms.map(r => {
                                        let currentCarried = Number(r.debt || 0);
                                        if (r.paymentStatus === 'debt' && r.subDebt > 0) currentCarried += Number(r.subDebt);
                                        if (r.paymentStatus === 'excess' && r.subDebt > 0) currentCarried -= Number(r.subDebt);
                                        
                                        return { 
                                            ...r, 
                                            lastElec: r.currentElec !== null ? r.currentElec : r.lastElec, 
                                            lastWater: r.currentWater !== null ? r.currentWater : r.lastWater, 
                                            currentElec: null, currentWater: null, paymentStatus: 'none', subDebt: 0, debt: currentCarried 
                                        };
                                    }) 
                                };
                                setData(newData); saveStorageData(month, year, newData);
                                syncToSheets(newData, month, year); 
                                return true;
                            } else {
                                wipeInitialData();
                                setSyncStatus({ text: 'Sổ mới trống', color: 'text-gray-400' });
                                return true;
                            }
                        }

                        const parsedData = parseSheetData(resData, data.buildings || []);
                        setData(parsedData); saveStorageData(month, year, parsedData);
                        setSyncStatus({ text: 'Dữ liệu mới nhất', color: 'text-green-400' });
                        setTimeout(() => setSyncStatus({ text: '', color: '' }), 2500);
                        return true;
                    }
                } catch (e) { setSyncStatus({ text: 'Lỗi tải Sheet', color: 'text-red-400' }); }
                return false;
            };

            useEffect(() => {
                if (skipFetchRef.current) { skipFetchRef.current = false; } 
                else { fetchDataFromSheet(currentMonth, currentYear); }
                const handleVisibilityChange = () => { if (document.visibilityState === 'visible') fetchDataFromSheet(currentMonth, currentYear); };
                document.addEventListener('visibilitychange', handleVisibilityChange);
                return () => document.removeEventListener('visibilitychange', handleVisibilityChange);
            }, [currentMonth, currentYear]);

            const handlePrevMonth = () => { 
                let m = currentMonth - 1; let y = currentYear;
                if (m < 1) { m = 12; y -= 1; }
                setCurrentMonth(m); setCurrentYear(y); 
            };
            
            const handleNextMonth = () => { 
                let m = currentMonth + 1; let y = currentYear;
                if (m > 12) { m = 1; y += 1; }
                setCurrentMonth(m); setCurrentYear(y); 
            };

            return (
                <div className="mobile-container relative">
                    <div className="bg-gray-900 text-white flex justify-between items-center px-4 py-3 z-50 flex-shrink-0">
                        <button onClick={handlePrevMonth} className="p-1.5 hover:bg-gray-800 rounded-lg"><Icon name="chevron-left" className="w-5 h-5" /></button>
                        <div className="text-center"><h1 className="font-semibold text-sm tracking-wider">THÁNG {currentMonth} / {currentYear}</h1>{syncStatus.text && <p className={`text-[10px] font-medium mt-0.5 ${syncStatus.color}`}>{syncStatus.text}</p>}</div>
                        <button onClick={handleNextMonth} className="p-1.5 hover:bg-gray-800 rounded-lg"><Icon name="chevron-right" className="w-5 h-5" /></button>
                    </div>

                    <div className="flex-1 min-h-0 relative">
                        {activeTab === 'ghi_so' && <TabGhiSo data={data} setData={setData} selectedBuilding={selectedBuilding} setSelectedBuilding={setSelectedBuilding} currentMonth={currentMonth} currentYear={currentYear} syncToSheets={syncToSheets} />}
                        {activeTab === 'thu_tien' && <TabThuTien data={data} setData={setData} selectedBuilding={selectedBuilding} setSelectedBuilding={setSelectedBuilding} currentMonth={currentMonth} currentYear={currentYear} syncToSheets={syncToSheets} />}
                        {activeTab === 'cai_dat' && <TabCaiDat data={data} setData={setData} selectedBuilding={selectedBuilding} setSelectedBuilding={setSelectedBuilding} currentMonth={currentMonth} currentYear={currentYear} syncToSheets={syncToSheets} />}
                    </div>

                    <div className="bg-white border-t border-gray-200 flex justify-around py-2 z-[90] flex-shrink-0">
                        <button onClick={() => setActiveTab('ghi_so')} className={`flex flex-col items-center py-1.5 px-4 rounded-xl transition-all ${activeTab === 'ghi_so' ? 'text-gray-900 font-bold' : 'text-gray-400 font-medium'}`}><Icon name="book-open" className="w-5 h-5 mb-1" /><span className="text-[11px] uppercase tracking-wide">Ghi Số</span></button>
                        <button onClick={() => setActiveTab('thu_tien')} className={`flex flex-col items-center py-1.5 px-4 rounded-xl transition-all ${activeTab === 'thu_tien' ? 'text-gray-900 font-bold' : 'text-gray-400 font-medium'}`}><Icon name="wallet" className="w-5 h-5 mb-1" /><span className="text-[11px] uppercase tracking-wide">Tính Tiền</span></button>
                        <button onClick={() => setActiveTab('cai_dat')} className={`flex flex-col items-center py-1.5 px-4 rounded-xl transition-all ${activeTab === 'cai_dat' ? 'text-gray-900 font-bold' : 'text-gray-400 font-medium'}`}><Icon name="settings" className="w-5 h-5 mb-1" /><span className="text-[11px] uppercase tracking-wide">Cài Đặt</span></button>
                    </div>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
